<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Elfis Garten</title>
  <meta name="theme-color" content="#2b6e45">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
  <main id="app"></main>

  <!-- Unsichtbare Foto-Eingaben: Kamera und Galerie -->
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="gallery" accept="image/*" hidden>
  <input type="file" id="restore" accept="application/json,.json" hidden>
  <input type="file" id="planCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="planGallery" accept="image/*" multiple hidden>

  <script type="module" src="js/app.js"></script>
